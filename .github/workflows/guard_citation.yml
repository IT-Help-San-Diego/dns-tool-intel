name: Guard CITATION.cff

on:
  pull_request:
    branches: [ main ]

# Least-privilege default — this guard only reads the checked-out tree to validate
# CITATION.cff; it never writes back. Satisfies CodeQL
# actions/missing-workflow-permissions.
permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Assert CITATION.cff has correct SPDX license
        run: |
          set -euo pipefail
          grep -nE '^license:\s*"BUSL-1\.1"\s*$' CITATION.cff >/dev/null \
            || { echo "FAIL: CITATION.cff license must be BUSL-1.1 (SPDX)."; \
                 echo "Found:"; grep -n '^license:' CITATION.cff || true; exit 1; }

      - name: Validate CITATION.cff schema
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install -U pip cffconvert
          cffconvert --validate --infile CITATION.cff
