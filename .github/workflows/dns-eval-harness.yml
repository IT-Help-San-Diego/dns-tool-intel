name: dns-eval-harness

on:
  push:
    paths:
      - "dns-eval/**"
  pull_request:
    paths:
      - "dns-eval/**"

permissions:
  contents: read

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tri-state harness regression + drift net
        run: python3 dns-eval/Mappings/test_harness.py
