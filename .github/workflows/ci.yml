name: CI — Build & Test

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.9'

      - name: Drift guard — handlers/ shim files
        run: bash scripts/check-handlers-no-shims.sh

      - name: Drift guard — single-write-path enforcement
        run: |
          # Enforces architect retrospective decision (2026-04-16):
          # scripts/git-sync.sh was the dual-write path that caused
          # repeated branch-overwrite incidents during the v26.45.x
          # refactor sprint. It must not return.
          # If you need a break-glass push, use scripts/git-push.sh.
          if [ -f "scripts/git-sync.sh" ]; then
            echo "::error::scripts/git-sync.sh has reappeared. This file was deleted on 2026-04-16 after causing repeated branch-overwrite incidents. Use scripts/git-push.sh as the single canonical write path."
            exit 1
          fi
          if grep -rEln "git[-_]?sync\.sh" scripts/ .github/ 2>/dev/null | grep -v "^.github/workflows/ci.yml$"; then
            echo "::error::A reference to git-sync.sh appeared in scripts/ or .github/. The single-write-path policy forbids reintroducing this dual write path."
            exit 1
          fi
          echo "✓ Single-write-path policy intact"

      - name: Build binary
        run: |
          cd go-server
          CGO_ENABLED=0 go build -ldflags "-s -w" -o ../dns-tool-server ./cmd/server

      - name: Run handler tests (per-tag, memory-bounded)
        # Compiles each build-tag bucket of internal/handlers as its own
        # test binary so peak compiler memory stays inside the standard
        # CI budget. Without this split, the combined ~43K-line handlers
        # test corpus has OOM-killed the Go compiler at ~5 GB available
        # RAM (see task #90, #96 and replit.md § "Test Build Tags").
        # A regression that pushes any single tag pass over the limit
        # fails CI with a clear "Pass: <tag>" log line.
        run: bash scripts/run-handler-tests-full.sh -short -count=1 -timeout=300s
        env:
          CGO_ENABLED: '0'
          GOGC: '50'
          GOMEMLIMIT: '6000MiB'

      - name: Run non-handler tests
        # Everything outside the top-level internal/handlers package,
        # including handler subpackages (adminpkg, agentpkg, authpkg,
        # badgepkg, contentpkg, ...) which are well under the memory
        # ceiling and safe to compile together.
        run: |
          # `|| true` guards against bash -e/-o pipefail killing the
          # assignment if grep ever matches zero lines — we want the
          # explicit empty-package check below to be the failure path,
          # not a silent shell exit.
          NON_HANDLER_PKGS=$(go list ./go-server/... | grep -v '/internal/handlers$' || true)
          if [ -z "$NON_HANDLER_PKGS" ]; then
            echo "::error::No non-handler packages found — go list returned empty after filter."
            exit 1
          fi
          go test $NON_HANDLER_PKGS -count=1 -short -timeout 300s -parallel=2
        env:
          CGO_ENABLED: '0'
          GOGC: '50'
          GOMEMLIMIT: '6000MiB'

      - name: Verify binary
        run: |
          ls -lh dns-tool-server
          file dns-tool-server

  handler-tests-db-integration:
    name: Handler Tests — dbtest + integration
    runs-on: ubuntu-latest
    # Closes the last gap in the handler test coverage map (task #97):
    # the default Build & Test job intentionally skips the `dbtest` and
    # `integration` tag buckets because they require a live PostgreSQL
    # service and outbound network respectively. This lane provides
    # both. It runs in parallel with the main build job rather than
    # blocking it, so a transient Postgres pull failure does not stall
    # the rest of the pipeline.

    services:
      postgres:
        # Sourced from Google's public Docker Hub pull-through cache
        # (mirror.gcr.io) instead of docker.io directly. Reason: the
        # GitHub Actions `services:` block starts the container before
        # any user step runs, which means we cannot wrap the pull in
        # retry/backoff. Anonymous pulls from Docker Hub are rate-limited
        # (100/IP/6h) and a runner sharing an outbound IP with another
        # heavy CI tenant has previously caused unrelated jobs to fail
        # with TOOMANYREQUESTS. mirror.gcr.io is a bit-for-bit pull-
        # through cache (same digest as docker.io/library/postgres:16-alpine)
        # operated by Google, free, public, and not subject to the Docker
        # Hub anonymous-pull quota. If mirror.gcr.io itself ever has an
        # outage, swap back to `postgres:16-alpine` as a one-line revert.
        image: mirror.gcr.io/library/postgres:16-alpine
        env:
          POSTGRES_USER: dnstool
          POSTGRES_PASSWORD: dnstool
          POSTGRES_DB: dnstool_test
        ports:
          - 5432:5432
        # The handler tests apply schema.sql via setupTestDB(), so we
        # only need the service to be accepting connections before the
        # `go test` invocation starts.
        options: >-
          --health-cmd "pg_isready -U dnstool -d dnstool_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.9'

      - name: Run dbtest + integration handler passes
        # Re-uses the same memory-bounded entry point as the main job
        # (scripts/run-handler-tests-full.sh — see task #96) but
        # overrides the tag list to run ONLY the buckets the default
        # lane skips. Each tag still compiles as its own test binary,
        # so the per-tag memory contract is preserved.
        #
        # Wrapped in nick-fields/retry@v3 (task #103) to make this lane
        # self-healing for transient INFRASTRUCTURE flakes, specifically:
        #   - mirror.gcr.io serving a 5xx or timing out while pulling
        #     the postgres:16-alpine image (the `services:` block above
        #     pulls before any user step runs, so we cannot retry the
        #     pull itself — but a retried `go test` invocation gives
        #     the runner another shot if the service eventually starts).
        #   - the postgres service container being slow to pass its
        #     initial pg_isready healthcheck and the first connection
        #     from setupTestDB() racing it.
        #   - sporadic `connection refused` from the loopback Postgres
        #     under runner CPU contention.
        #
        # The retry is NOT intended to mask real test failures: a
        # genuine assertion failure or compile error will reproduce on
        # every attempt, exhaust max_attempts, and fail the job. Retry
        # count and backoff are deliberately small so a true regression
        # surfaces in well under twice the normal wall time.
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 2
          retry_wait_seconds: 30
          command: bash scripts/run-handler-tests-full.sh -count=1 -timeout=600s
        env:
          HANDLER_TAG_PASSES: 'dbtest integration'
          DATABASE_URL: 'postgres://dnstool:dnstool@localhost:5432/dnstool_test?sslmode=disable'
          CGO_ENABLED: '0'
          GOGC: '50'
          GOMEMLIMIT: '6000MiB'
