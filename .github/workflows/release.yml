name: Create Release

on:
  push:
    tags:
      - 'v*'

# Least-privilege default. The release job escalates to contents: write (it
# creates the GitHub Release for the pushed tag); nothing else is granted.
permissions:
  contents: read

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # contents: write — create the GitHub Release + upload the binary asset.
      # id-token: write + attestations: write — required by
      # actions/attest-build-provenance to mint a signed SLSA provenance
      # statement for the released binary via the Actions OIDC token.
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.12'

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build release binary
        # Canonical builder. --deploy keeps Go caches in /tmp and injects the
        # git-derived version via ldflags (fetch-depth: 0 above gives
        # scripts/version.sh the tag history it needs). Produces ./dns-tool-server.
        run: bash build.sh --deploy

      - name: Attest build provenance
        # Mints a signed SLSA provenance statement binding the exact binary
        # bytes (by SHA-256 digest) to this workflow, repo, and commit. Verify
        # with: gh attestation verify dns-tool-server --repo <owner>/<repo>
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dns-tool-server

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          name: "scientific release workflow"
          body: |
            ## DNS Tool ${{ github.ref_name }}

            All versioned artifacts bumped to ${{ steps.version.outputs.version }}.
            PDFs regenerated. Quality gates passed.
            Synced from dns-tool-intel via release pipeline.
          generate_release_notes: true
          files: dns-tool-server
