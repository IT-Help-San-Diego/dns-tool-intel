name: Create Release

on:
  push:
    tags:
      - 'v*'

# Least-privilege default. The release job escalates to contents: write (it
# creates the GitHub Release for the pushed tag); nothing else is granted.
permissions:
  contents: read

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: "scientific release workflow"
          body: |
            ## DNS Tool ${{ github.ref_name }}

            All versioned artifacts bumped to ${{ steps.version.outputs.version }}.
            PDFs regenerated. Quality gates passed.
            Synced from dns-tool-intel via release pipeline.
          generate_release_notes: true
