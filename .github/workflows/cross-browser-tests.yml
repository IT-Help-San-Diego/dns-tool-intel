name: Cross-Browser E2E Tests (SUSPENDED)

on:
  workflow_dispatch:

# Least-privilege default — this workflow only checks out, builds, and runs E2E
# tests; it never writes back to the repo. Satisfies CodeQL
# actions/missing-workflow-permissions.
permissions:
  contents: read

jobs:
  test:
    if: false
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit, iphone-safari, ipad-safari]

    services:
      postgres:
        # Mirror.gcr.io (Google's pull-through cache) avoids Docker Hub's
        # anonymous-pull quota (100/IP/6h) which has TOOMANYREQUESTS-failed
        # CI before; see tasks #98/#102 in ci.yml for the full rationale.
        # Digest below = Postgres 16.13 and MUST stay in lockstep with the
        # same digest in ci.yml's `handler-tests-db-integration` job so
        # both CI lanes test against identical Postgres bytes. To refresh:
        #   docker buildx imagetools inspect mirror.gcr.io/library/postgres:16-alpine
        # and update the @sha256:... suffix in BOTH workflows.
        image: mirror.gcr.io/library/postgres:16-alpine@sha256:4e6e670bb069649261c9c18031f0aded7bb249a5b6664ddec29c013a89310d50
        env:
          POSTGRES_USER: dnstool
          POSTGRES_PASSWORD: dnstool
          POSTGRES_DB: dnstool
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 20

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.11'

      - name: Install Node dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser == 'iphone-safari' && 'webkit' || matrix.browser == 'ipad-safari' && 'webkit' || matrix.browser }}

      - name: Build Go server
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Initialize database schema
        run: PGPASSWORD=dnstool psql -h localhost -U dnstool -d dnstool -f go-server/db/schema/schema.sql

      - name: Start server and wait for ready
        run: |
          ./dns-tool-server &
          SERVER_PID=$!
          echo "Server PID: $SERVER_PID"
          for i in $(seq 1 60); do
            if curl -s http://localhost:5000/ > /dev/null 2>&1; then
              echo "Server is ready after ${i}s"
              exit 0
            fi
            if ! kill -0 $SERVER_PID 2>/dev/null; then
              echo "Server process died"
              exit 1
            fi
            echo "Waiting for server... ($i/60)"
            sleep 1
          done
          echo "Server failed to start within 60s"
          exit 1
        env:
          PORT: "5000"
          DATABASE_URL: "postgres://dnstool:dnstool@localhost:5432/dnstool?sslmode=disable"
          SESSION_SECRET: "ci-test-session-secret-not-for-production"

      - name: Run Playwright tests — ${{ matrix.browser }}
        run: npx playwright test --project=${{ matrix.browser }}
        env:
          PORT: "5000"
          DATABASE_URL: "postgres://dnstool:dnstool@localhost:5432/dnstool?sslmode=disable"
          SESSION_SECRET: "ci-test-session-secret-not-for-production"
          BASE_URL: http://localhost:5000

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 14

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: test-results-${{ matrix.browser }}
          path: test-results/
          retention-days: 14
