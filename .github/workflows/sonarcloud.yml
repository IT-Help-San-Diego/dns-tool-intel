name: SonarCloud Full Product Analysis

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  coverage:
    name: Generate Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Run Go tests with coverage
        run: |
          go test ./go-server/... -tags intel -coverprofile=coverage.out -covermode=atomic -count=1 -short -timeout 300s -parallel=2
        env:
          CGO_ENABLED: '0'
          DNS_TOOL_REPO_ROLE: intel
          GOGC: '50'
          GOMEMLIMIT: '1500MiB'

      - name: Verify coverage completeness
        run: |
          echo "=== Coverage report summary ==="
          TOTAL_LINES=$(grep -c "^dnstool" coverage.out || echo 0)
          HANDLER_LINES=$(grep -c "go-server/internal/handlers/" coverage.out || echo 0)
          ANALYZER_LINES=$(grep -c "go-server/internal/analyzer/" coverage.out || echo 0)
          echo "Total coverage lines: $TOTAL_LINES"
          echo "Handler coverage lines: $HANDLER_LINES"
          echo "Analyzer coverage lines: $ANALYZER_LINES"

          if [ "$HANDLER_LINES" -lt 100 ]; then
            echo "::error::Handler coverage missing from coverage.out ($HANDLER_LINES lines found, expected 100+)"
            echo "Packages present:"
            grep "^dnstool" coverage.out | sed 's|:.*||' | sed 's|/[^/]*$||' | sort -u
            exit 1
          fi

          echo "=== Per-package coverage ==="
          go tool cover -func=coverage.out | grep "^total:" || true

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 1

  scan-full:
    name: SonarCloud Scan (Full Product)
    needs: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-report

      - name: SonarCloud Scan
        uses: sonarsource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  scan-web:
    name: SonarCloud Scan (Open-Core)
    needs: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-report

      - name: SonarCloud Scan
        uses: sonarsource/sonarqube-scan-action@v7
        with:
          args: >
            -Dsonar.projectKey=careyjames_dns-tool-web
            -Dsonar.projectName=DNS Tool
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_CAREY }}
          SONAR_HOST_URL: https://sonarcloud.io
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
