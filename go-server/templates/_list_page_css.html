{{define "list_page_css"}}
<style nonce="{{.CspNonce}}">
    .text-center{text-align:center}
    .my-4{margin-top:1.5rem;margin-bottom:1.5rem}
    .mb-0{margin-bottom:0}
    .mb-1{margin-bottom:.25rem}
    .mb-2{margin-bottom:.5rem}
    .mb-3{margin-bottom:1rem}
    .mb-4{margin-bottom:1.5rem}
    .mt-4{margin-top:1.5rem}
    .mt-5{margin-top:3rem}
    .py-2{padding-top:.5rem;padding-bottom:.5rem}
    .py-3{padding-top:1rem;padding-bottom:1rem}
    .py-5{padding-top:3rem;padding-bottom:3rem}
    .px-3{padding-left:1rem;padding-right:1rem}
    .me-1{margin-inline-end:.25rem}
    .me-2{margin-inline-end:.5rem}
    .ms-1{margin-inline-start:.25rem}
    .ms-2{margin-inline-start:.5rem}
    .ms-auto{margin-inline-start:auto}
    .text-muted{color:#adb5bd!important}
    .text-primary{color:#0d6efd!important}
    .text-light{color:#f8f9fa!important}
    .fw-medium{font-weight:500}
    .small{font-size:.875em}
    .d-flex{display:flex}
    .d-none{display:none}
    .gap-1{gap:.25rem}
    .gap-2{gap:.5rem}
    .flex-wrap{flex-wrap:wrap}
    .flex-shrink-0{flex-shrink:0}
    .align-items-center{align-items:center}
    .align-items-start{align-items:start}
    .justify-content-between{justify-content:space-between}
    .justify-content-center{justify-content:center}
    .min-width-0{min-width:0}
    .text-truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .form-control{display:block;width:100%;padding:.375rem .75rem;font-size:1rem;background-color:#2b3035;border:1px solid #495057;border-radius:.375rem;color:#dee2e6}
    .btn{display:inline-block;padding:.375rem .75rem;font-size:1rem;border-radius:.375rem;text-decoration:none;cursor:pointer;border:1px solid transparent}
    .btn-primary{background-color:var(--bs-primary);border-color:var(--bs-primary);color:#fff}
    .btn-sm{padding:.25rem .5rem;font-size:.875rem}
    .btn-outline-primary{color:#0d6efd;border-color:#0d6efd;background:transparent}
    .btn-outline-success{color:#198754;border-color:#198754;background:transparent}
    .btn-outline-warning{color:#ffc107;border-color:#ffc107;background:transparent}
    .btn-outline-secondary{color:#6c757d;border-color:#6c757d;background:transparent}
    .btn-group{display:inline-flex}
    .btn-group>.btn{border-radius:0}.btn-group>.btn:first-child{border-top-left-radius:.375rem;border-bottom-left-radius:.375rem}.btn-group>.btn:last-child{border-top-right-radius:.375rem;border-bottom-right-radius:.375rem}
    .input-group{display:flex;flex-wrap:wrap}
    .input-group>.form-control{flex:1 1 auto;width:1%}
    .input-group-text{display:flex;align-items:center;padding:.375rem .75rem;font-size:1rem;border:1px solid #495057;border-radius:.375rem}
    .table{width:100%;margin-bottom:1rem;color:#dee2e6;border-collapse:collapse}
    .table th,.table td{padding:.5rem;vertical-align:top;border-top:1px solid #495057}
    .table thead th{vertical-align:bottom;border-bottom:2px solid #495057}
    .table-hover tbody tr:hover{background-color:rgba(255,255,255,.075)}
    .table-responsive{overflow-x:auto;-webkit-overflow-scrolling:touch}
    .badge{display:inline-block;padding:.35em .65em;font-size:.75em;font-weight:700;border-radius:.25rem;color:#fff}
    .bg-success{background-color:#198754!important}
    .bg-warning{background-color:#ffc107!important;color:#000!important}
    .bg-danger{background-color:#dc3545!important}
    .bg-info{background-color:#d4a853!important}
    .bg-secondary{background-color:#6c757d!important}
    .pagination{display:flex;padding-left:0;list-style:none;gap:.25rem}
    .page-item.active .page-link{background-color:#0d6efd;border-color:#0d6efd;color:#fff}
    .page-item.disabled .page-link{color:#6c757d;pointer-events:none}
    .page-link{padding:.375rem .75rem;color:#6ea8fe;text-decoration:none;background-color:#2b3035;border:1px solid #495057;border-radius:.375rem}
    .h3{font-size:1.75rem;font-weight:500}
    @media(min-width:768px){.d-md-none{display:none!important}.d-none.d-md-block{display:block!important}}
    @media(max-width:767.98px){.d-md-none{display:block}.d-none.d-md-block{display:none!important}}
    @media(min-width:576px){.d-none.d-sm-inline{display:inline!important}}
    .navbar-nav{display:flex;list-style:none;margin:0;padding:0}
    .nav-link{color:rgba(255,255,255,.55);text-decoration:none;padding:.5rem 1rem}
    .row{display:flex;flex-wrap:wrap;margin:0 -.75rem}
</style>
{{end}}
