{{define "scan_topology"}}
<div class="scan-topology mt-1" id="scanTopology" aria-hidden="true">
    <div class="topo-instruments">
        <div class="topo-meter topo-meter-left" id="meterLeft">
            <div class="meter-title">Acquisition</div>
            <div class="meter-group">
                <div class="meter-label">Phases Complete</div>
                <div class="meter-bar-track"><div class="meter-bar-fill" id="meterPhaseBar"></div></div>
                <div class="meter-value" id="meterPhaseVal">0 / 9</div>
            </div>
            <div class="meter-group">
                <div class="meter-label">Tasks Resolved</div>
                <div class="meter-bar-track"><div class="meter-bar-fill meter-bar-fill-tasks" id="meterTaskBar"></div></div>
                <div class="meter-value" id="meterTaskVal">0</div>
            </div>
            <div class="meter-rule"></div>
            <div class="meter-group">
                <div class="meter-label">Server Polls</div>
                <div class="meter-readout" id="meterPollVal">0</div>
            </div>
            <div class="meter-group">
                <div class="meter-label">Elapsed</div>
                <div class="meter-readout" id="meterElapsedVal">0.0s</div>
            </div>
            <div class="meter-group">
                <div class="meter-label">Poll Interval</div>
                <div class="meter-readout">500ms</div>
            </div>
        </div>
        <div class="topo-stack">
            <canvas class="topo-globe-canvas" width="900" height="840"></canvas>
            <svg viewBox="-200 -240 900 840" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Live intelligence pipeline topology" class="topo-svg">
                <desc>ViewBox 900×840. Globe canvas is a sibling layer sized to match the SVG viewport. Signal arcs converge toward pipeline nodes below the globe.</desc>
                <defs>
                    <filter id="glow-dns" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="blur"/><feFlood flood-color="#5c6bc0" flood-opacity="0.5" result="color"/><feComposite in="color" in2="blur" operator="in" result="glow"/><feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
                    <filter id="glow-email" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="blur"/><feFlood flood-color="#4fc3f7" flood-opacity="0.5" result="color"/><feComposite in="color" in2="blur" operator="in" result="glow"/><feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
                    <filter id="glow-dnssec" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="blur"/><feFlood flood-color="#81c784" flood-opacity="0.5" result="color"/><feComposite in="color" in2="blur" operator="in" result="glow"/><feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
                    <filter id="glow-ct" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="blur"/><feFlood flood-color="#78909c" flood-opacity="0.5" result="color"/><feComposite in="color" in2="blur" operator="in" result="glow"/><feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
                    <filter id="glow-smtp" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="blur"/><feFlood flood-color="#81c784" flood-opacity="0.5" result="color"/><feComposite in="color" in2="blur" operator="in" result="glow"/><feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
                    <filter id="glow-policy" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="blur"/><feFlood flood-color="#ffb74d" flood-opacity="0.5" result="color"/><feComposite in="color" in2="blur" operator="in" result="glow"/><feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
                    <filter id="glow-registrar" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="blur"/><feFlood flood-color="#ce93d8" flood-opacity="0.5" result="color"/><feComposite in="color" in2="blur" operator="in" result="glow"/><feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
                    <filter id="glow-engine" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="blur"/><feFlood flood-color="#e0e0e0" flood-opacity="0.5" result="color"/><feComposite in="color" in2="blur" operator="in" result="glow"/><feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
                    <filter id="glow-web3" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="blur"/><feFlood flood-color="#d4a853" flood-opacity="0.5" result="color"/><feComposite in="color" in2="blur" operator="in" result="glow"/><feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
                    <radialGradient id="node-glass" cx="38%" cy="32%" r="75%">
                        <stop offset="0" stop-color="rgba(50,60,80,0.22)"/>
                        <stop offset="0.6" stop-color="rgba(28,33,40,0.12)"/>
                        <stop offset="1" stop-color="rgba(18,22,28,0.28)"/>
                    </radialGradient>
                    <radialGradient id="node-highlight" cx="35%" cy="28%" r="55%">
                        <stop offset="0" stop-color="rgba(255,255,255,0.06)"/>
                        <stop offset="1" stop-color="rgba(255,255,255,0)"/>
                    </radialGradient>
                </defs>

                <line x1="230" y1="255" x2="68" y2="330" class="topo-connector" data-from="dns_records" data-to="email_auth"/>
                <line x1="230" y1="255" x2="176" y2="330" class="topo-connector" data-from="dns_records" data-to="dnssec_dane"/>
                <line x1="230" y1="255" x2="284" y2="330" class="topo-connector" data-from="dns_records" data-to="ct_subdomains"/>
                <line x1="230" y1="255" x2="392" y2="330" class="topo-connector" data-from="dns_records" data-to="smtp_transport"/>
                <line x1="68" y1="330" x2="122" y2="405" class="topo-connector" data-from="email_auth" data-to="policy_records"/>
                <line x1="176" y1="330" x2="230" y2="405" class="topo-connector" data-from="dnssec_dane" data-to="registrar_infra"/>
                <line x1="284" y1="330" x2="122" y2="405" class="topo-connector" data-from="ct_subdomains" data-to="policy_records"/>
                <line x1="392" y1="330" x2="230" y2="405" class="topo-connector" data-from="smtp_transport" data-to="registrar_infra"/>
                <line x1="230" y1="255" x2="338" y2="405" class="topo-connector" data-from="dns_records" data-to="web3_analysis"/>
                <line x1="122" y1="405" x2="230" y2="480" class="topo-connector" data-from="policy_records" data-to="analysis_engine"/>
                <line x1="230" y1="405" x2="230" y2="480" class="topo-connector" data-from="registrar_infra" data-to="analysis_engine"/>
                <line x1="338" y1="405" x2="230" y2="480" class="topo-connector" data-from="web3_analysis" data-to="analysis_engine"/>

                <g data-phase="dns_records" data-pkey="dns">
                    <circle cx="230" cy="255" r="44" class="topo-halo"/>
                    <circle cx="230" cy="255" r="38" class="topo-ring"/>
                    <circle cx="230" cy="255" r="32" class="topo-node"/>
                    <circle cx="230" cy="255" r="32" fill="url(#node-highlight)" pointer-events="none"/>
                    <text x="230" y="251" class="topo-label">DNS</text>
                    <text x="230" y="260" class="topo-label topo-label-sub">Records</text>
                    <text x="230" y="271" class="topo-sub" data-tasks="dns_records">0/3</text>
                </g>
                <text x="230" y="305" class="topo-dur" data-dur="dns_records"></text>

                <g data-phase="email_auth" data-pkey="email">
                    <circle cx="68" cy="330" r="44" class="topo-halo"/>
                    <circle cx="68" cy="330" r="38" class="topo-ring"/>
                    <circle cx="68" cy="330" r="32" class="topo-node"/>
                    <circle cx="68" cy="330" r="32" fill="url(#node-highlight)" pointer-events="none"/>
                    <text x="68" y="326" class="topo-label">Email</text>
                    <text x="68" y="335" class="topo-label topo-label-sub">Auth</text>
                    <text x="68" y="346" class="topo-sub" data-tasks="email_auth">0/3</text>
                </g>
                <text x="68" y="380" class="topo-dur" data-dur="email_auth"></text>

                <g data-phase="dnssec_dane" data-pkey="dnssec">
                    <circle cx="176" cy="330" r="44" class="topo-halo"/>
                    <circle cx="176" cy="330" r="38" class="topo-ring"/>
                    <circle cx="176" cy="330" r="32" class="topo-node"/>
                    <circle cx="176" cy="330" r="32" fill="url(#node-highlight)" pointer-events="none"/>
                    <text x="176" y="326" class="topo-label">DNSSEC</text>
                    <text x="176" y="335" class="topo-label topo-label-sub">DANE</text>
                    <text x="176" y="346" class="topo-sub" data-tasks="dnssec_dane">0/4</text>
                </g>
                <text x="176" y="380" class="topo-dur" data-dur="dnssec_dane"></text>

                <g data-phase="ct_subdomains" data-pkey="ct">
                    <circle cx="284" cy="330" r="44" class="topo-halo"/>
                    <circle cx="284" cy="330" r="38" class="topo-ring"/>
                    <circle cx="284" cy="330" r="32" class="topo-node"/>
                    <circle cx="284" cy="330" r="32" fill="url(#node-highlight)" pointer-events="none"/>
                    <text x="284" y="326" class="topo-label">CT/Sub</text>
                    <text x="284" y="335" class="topo-label topo-label-sub">domains</text>
                    <text x="284" y="346" class="topo-sub" data-tasks="ct_subdomains">0/4</text>
                </g>
                <text x="284" y="380" class="topo-dur" data-dur="ct_subdomains"></text>

                <g data-phase="smtp_transport" data-pkey="smtp">
                    <circle cx="392" cy="330" r="44" class="topo-halo"/>
                    <circle cx="392" cy="330" r="38" class="topo-ring"/>
                    <circle cx="392" cy="330" r="32" class="topo-node"/>
                    <circle cx="392" cy="330" r="32" fill="url(#node-highlight)" pointer-events="none"/>
                    <text x="392" y="326" class="topo-label">SMTP</text>
                    <text x="392" y="335" class="topo-label topo-label-sub">Transport</text>
                    <text x="392" y="346" class="topo-sub" data-tasks="smtp_transport">0/3</text>
                </g>
                <text x="392" y="380" class="topo-dur" data-dur="smtp_transport"></text>

                <g data-phase="policy_records" data-pkey="policy">
                    <circle cx="122" cy="405" r="44" class="topo-halo"/>
                    <circle cx="122" cy="405" r="38" class="topo-ring"/>
                    <circle cx="122" cy="405" r="32" class="topo-node"/>
                    <circle cx="122" cy="405" r="32" fill="url(#node-highlight)" pointer-events="none"/>
                    <text x="122" y="401" class="topo-label">Policy</text>
                    <text x="122" y="410" class="topo-label topo-label-sub">Records</text>
                    <text x="122" y="421" class="topo-sub" data-tasks="policy_records">0/4</text>
                </g>
                <text x="122" y="455" class="topo-dur" data-dur="policy_records"></text>

                <g data-phase="registrar_infra" data-pkey="registrar">
                    <circle cx="230" cy="405" r="44" class="topo-halo"/>
                    <circle cx="230" cy="405" r="38" class="topo-ring"/>
                    <circle cx="230" cy="405" r="32" class="topo-node"/>
                    <circle cx="230" cy="405" r="32" fill="url(#node-highlight)" pointer-events="none"/>
                    <text x="230" y="401" class="topo-label">Registrar</text>
                    <text x="230" y="410" class="topo-label topo-label-sub">Infra</text>
                    <text x="230" y="421" class="topo-sub" data-tasks="registrar_infra">0/5</text>
                </g>
                <text x="230" y="455" class="topo-dur" data-dur="registrar_infra"></text>

                <g data-phase="web3_analysis" data-pkey="web3">
                    <circle cx="338" cy="405" r="44" class="topo-halo"/>
                    <circle cx="338" cy="405" r="38" class="topo-ring"/>
                    <circle cx="338" cy="405" r="32" class="topo-node"/>
                    <circle cx="338" cy="405" r="32" fill="url(#node-highlight)" pointer-events="none"/>
                    <text x="338" y="402" class="topo-label">Web3</text>
                    <text x="338" y="414" class="topo-sub" data-tasks="web3_analysis">0/1</text>
                </g>
                <text x="338" y="455" class="topo-dur" data-dur="web3_analysis"></text>

                <g data-phase="analysis_engine" data-pkey="engine">
                    <circle cx="230" cy="480" r="44" class="topo-halo"/>
                    <circle cx="230" cy="480" r="38" class="topo-ring"/>
                    <circle cx="230" cy="480" r="32" class="topo-node"/>
                    <circle cx="230" cy="480" r="32" fill="url(#node-highlight)" pointer-events="none"/>
                    <text x="230" y="476" class="topo-label">ICIE</text>
                    <text x="230" y="485" class="topo-label topo-label-sub">Engine</text>
                    <text x="230" y="496" class="topo-sub" data-tasks="analysis_engine">0/10</text>
                </g>
                <text x="230" y="530" class="topo-dur" data-dur="analysis_engine"></text>
            </svg>
        </div>
        <div class="topo-meter topo-meter-right" id="meterRight">
            <div class="meter-title">Latency</div>
            <div class="meter-phase-rows">
                <div class="meter-phase-row" data-mrow="dns_records">
                    <span class="meter-phase-name">DNS</span>
                    <div class="meter-bar-track"><div class="meter-bar-fill" data-mbar="dns_records"></div></div>
                    <span class="meter-phase-ms" data-mms="dns_records">&mdash;</span>
                </div>
                <div class="meter-phase-row" data-mrow="email_auth">
                    <span class="meter-phase-name">Email</span>
                    <div class="meter-bar-track"><div class="meter-bar-fill" data-mbar="email_auth"></div></div>
                    <span class="meter-phase-ms" data-mms="email_auth">&mdash;</span>
                </div>
                <div class="meter-phase-row" data-mrow="dnssec_dane">
                    <span class="meter-phase-name">DNSSEC</span>
                    <div class="meter-bar-track"><div class="meter-bar-fill" data-mbar="dnssec_dane"></div></div>
                    <span class="meter-phase-ms" data-mms="dnssec_dane">&mdash;</span>
                </div>
                <div class="meter-phase-row" data-mrow="ct_subdomains">
                    <span class="meter-phase-name">CT/Sub</span>
                    <div class="meter-bar-track"><div class="meter-bar-fill" data-mbar="ct_subdomains"></div></div>
                    <span class="meter-phase-ms" data-mms="ct_subdomains">&mdash;</span>
                </div>
                <div class="meter-phase-row" data-mrow="smtp_transport">
                    <span class="meter-phase-name">SMTP</span>
                    <div class="meter-bar-track"><div class="meter-bar-fill" data-mbar="smtp_transport"></div></div>
                    <span class="meter-phase-ms" data-mms="smtp_transport">&mdash;</span>
                </div>
                <div class="meter-phase-row" data-mrow="policy_records">
                    <span class="meter-phase-name">Policy</span>
                    <div class="meter-bar-track"><div class="meter-bar-fill" data-mbar="policy_records"></div></div>
                    <span class="meter-phase-ms" data-mms="policy_records">&mdash;</span>
                </div>
                <div class="meter-phase-row" data-mrow="registrar_infra">
                    <span class="meter-phase-name">Registrar</span>
                    <div class="meter-bar-track"><div class="meter-bar-fill" data-mbar="registrar_infra"></div></div>
                    <span class="meter-phase-ms" data-mms="registrar_infra">&mdash;</span>
                </div>
                <div class="meter-phase-row" data-mrow="web3_analysis">
                    <span class="meter-phase-name">Web3</span>
                    <div class="meter-bar-track"><div class="meter-bar-fill" data-mbar="web3_analysis"></div></div>
                    <span class="meter-phase-ms" data-mms="web3_analysis">&mdash;</span>
                </div>
                <div class="meter-phase-row" data-mrow="analysis_engine">
                    <span class="meter-phase-name">Engine</span>
                    <div class="meter-bar-track"><div class="meter-bar-fill" data-mbar="analysis_engine"></div></div>
                    <span class="meter-phase-ms" data-mms="analysis_engine">&mdash;</span>
                </div>
            </div>
            <div class="meter-rule"></div>
            <div class="meter-stats">
                <div class="meter-stat-row"><span class="meter-stat-label">AVG</span><span class="meter-stat-value" id="meterAvgMs">&mdash;</span></div>
                <div class="meter-stat-row"><span class="meter-stat-label">MIN</span><span class="meter-stat-value" id="meterMinMs">&mdash;</span></div>
                <div class="meter-stat-row"><span class="meter-stat-label">MAX</span><span class="meter-stat-value" id="meterMaxMs">&mdash;</span></div>
            </div>
        </div>
    </div>
</div>
{{end}}
