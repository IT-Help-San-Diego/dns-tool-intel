# DNS Tool — one-command local evaluation
#
#   docker compose up
#
# Brings up PostgreSQL 16 and the platform together, loads the base schema, and
# generates a throwaway session secret. Nothing here is production
# configuration: the credentials are fixed and the database is disposable.
#
# Why this file exists: the server requires DATABASE_URL and SESSION_SECRET and
# exits 1 without them (go-server/internal/config/config.go). A researcher
# evaluating the tool should not have to provision Postgres by hand first.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dnstool
      POSTGRES_PASSWORD: dnstool_local_only
      POSTGRES_DB: dnstool
    # The base schema is NOT applied by the server: RunSeedMigrations only runs
    # files whose names contain "seed". Postgres executes anything mounted in
    # docker-entrypoint-initdb.d on first start, which covers it.
    volumes:
      - ./go-server/db/schema/schema.sql:/docker-entrypoint-initdb.d/00-schema.sql:ro
      - dnstool-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dnstool -d dnstool"]
      interval: 3s
      timeout: 5s
      retries: 20
    # Published to the HOST LOOPBACK ONLY so a researcher can point TablePlus,
    # psql or DataGrip at their own scan history. This is the difference between
    # a demo and an instrument: the data is theirs and they should be able to
    # read it with their own tools.
    #
    # The 127.0.0.1 prefix is load-bearing. Without it Docker binds 0.0.0.0 and
    # publishes the database to every interface — a laptop on conference wifi
    # would be serving its scan history to the room.
    #
    # 5432 is skipped because a developer very likely already runs Postgres
    # there, and 5433 because this project's own dev container uses it. 5434 is
    # only a default: any collision is escaped without editing this file, e.g.
    #   DNSTOOL_DB_PORT=15432 docker compose up
    # Whatever it ends up as, this always reports the truth rather than assuming:
    #   docker compose port db 5432
    ports:
      - "127.0.0.1:${DNSTOOL_DB_PORT:-5434}:5432"

  app:
    build:
      context: .
      args:
        VERSION: compose-local
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://dnstool:dnstool_local_only@db:5432/dnstool?sslmode=disable"
      # Local-only throwaway. Override with `SESSION_SECRET=... docker compose up`
      # if you want a different one; never reuse this value anywhere real.
      SESSION_SECRET: "${SESSION_SECRET:-local-evaluation-only-not-a-real-secret}"
      PORT: "5000"
    # Host side is 5055, NOT 5000: on macOS the AirPlay Receiver service
    # (ControlCe) binds 5000 and answers every request with 403 Forbidden and a
    # `Server: AirTunes` header, so localhost:5000 never reaches this container.
    # Verified 2026-07-26 via `lsof -iTCP:5000 -sTCP:LISTEN`.
    # Container side stays 5000 (PORT default).
    ports:
      - "5055:5000"

volumes:
  dnstool-pgdata:
